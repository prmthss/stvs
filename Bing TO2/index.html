<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen Gabungan</title>
  <style>
    /* Reset & Tata letak utama */
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


        @media (max-width: 600px) {
      .page-container {
        width: 500px;
        max-width: 600px;
      }
      body {
        margin: 5rem;
        width: 100%;
        align-items: center;
      }
}
    /* Container untuk masing-masing halaman */
    .page-container {
      width: 550px;
      height: 800px;
      position: relative;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      overflow: hidden;
    }


    /* Loader sederhana saat memuat file */
    .loading-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: sans-serif;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Tempat halaman akan dimuat secara berurutan -->
  <div id="document-wrapper"></div>

  <script>
    // Daftar file HTML yang ingin dimasukkan berurutan
    const pageFiles = [
      'ba350a9e-1fd3-49ac-ab25-86ddddbaa60e.html',
      '2d539d93-49d4-4092-aac3-784b5940b238.html',   
      '9e350448-3448-4f65-bfd2-a12f5c058ec2.html',
      'c5b7e3d2-a37a-40a1-9a1f-9302fab3083c.html',
      'd283ebd2-670b-4a88-9f7d-0dcc8a8a246e.html',
      'aa57e25a-f65f-47b7-b65a-6a7f3eb9fab1.html',
      '5e4800d7-b910-4dd4-a087-f2133cad57a1.html',
    ];

    const wrapper = document.getElementById('document-wrapper');

    async function loadPages() {
      for (const file of pageFiles) {
        // Buat pembungkus halaman
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-container';
        pageDiv.innerHTML = `<div class="loading-placeholder">Memuat ${file}...</div>`;
        wrapper.appendChild(pageDiv);

        try {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`Gagal memuat ${file}`);
          const htmlText = await response.text();

          // Parsing HTML untuk mengambil hanya bagian isi <body> dan <style>
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');
          
          // Bersihkan container dan masukkan konten asli
          pageDiv.innerHTML = doc.body.innerHTML;
        } catch (error) {
          console.error(error);
          pageDiv.innerHTML = `<div class="loading-placeholder" style="color:red;">Gagal memuat ${file}</div>`;
        }
      }
    }

    loadPages();
  </script>
</body>
</html>
