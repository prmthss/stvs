<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen Gabungan</title>
  <style>
    /* Reset & Tata letak utama */
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


            @media (max-width: 600px) {
      .page-container {
        width: 500px;
        max-width: 600px;
      }
      body {
        margin: 5rem;
        width: 100%;
        align-items: center;
      }}



    /* Container untuk masing-masing halaman */
    .page-container {
      width: 550px;
      height: 800px;
      position: relative;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      overflow: hidden;
    }


    /* Loader sederhana saat memuat file */
    .loading-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: sans-serif;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Tempat halaman akan dimuat secara berurutan -->
  <div id="document-wrapper"></div>

  <script>
    // Daftar file HTML yang ingin dimasukkan berurutan
    const pageFiles = [
      'd201398d-2725-4f73-b5f9-764999fb545a.html',
      'cf8cb240-0238-4767-a0ac-2862d94edef4.html',
      '171510ff-f709-46ff-989a-90ff7049e19e.html',
      '30201f19-9eec-4858-8876-b06db3967c38.html',
      '95c1df94-5a83-4b5c-8274-75d7a4943ea4.html',

      '5eadfc9d-dbd2-4318-9a9e-1df0cc69c433.html',
      
      
      
      'ac1ea93f-d618-4089-92d6-804bbeb7b38a.html',
      
      
      '4e821ac1-b073-4b13-b5a2-ba7c68910ac9.html',
    ];

    const wrapper = document.getElementById('document-wrapper');

    async function loadPages() {
      for (const file of pageFiles) {
        // Buat pembungkus halaman
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-container';
        pageDiv.innerHTML = `<div class="loading-placeholder">Memuat ${file}...</div>`;
        wrapper.appendChild(pageDiv);

        try {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`Gagal memuat ${file}`);
          const htmlText = await response.text();

          // Parsing HTML untuk mengambil hanya bagian isi <body> dan <style>
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');
          
          // Bersihkan container dan masukkan konten asli
          pageDiv.innerHTML = doc.body.innerHTML;
        } catch (error) {
          console.error(error);
          pageDiv.innerHTML = `<div class="loading-placeholder" style="color:red;">Gagal memuat ${file}</div>`;
        }
      }
    }

    loadPages();
  </script>
</body>
</html>
